{% extends "base.html" %}
{% block title %}My Haunt Tour - {{ site_name }}{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
#tour-map { height: 320px; border-radius: 12px; margin-bottom: 1rem; }
.tour-controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.mode-toggle { display: flex; background: var(--bg2); border-radius: 999px; padding: 3px; }
.mode-toggle button { padding: 0.4rem 1rem; border-radius: 999px; border: none; background: none; color: var(--muted); font-size: 0.9rem; cursor: pointer; }
.mode-toggle button.active { background: var(--accent); color: #1a0f00; font-weight: 700; }
.tour-list { list-style: none; padding: 0; margin: 0 0 1rem; }
.tour-list li { display: flex; gap: 0.6rem; align-items: center; background: var(--card); border: 1px solid #33254f; border-radius: 10px; padding: 0.6rem; margin-bottom: 0.5rem; }
.tour-thumb { width: 3.5rem; height: 3.5rem; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.tour-num { background: var(--accent); color: #1a0f00; font-weight: 700; width: 1.8rem; height: 1.8rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tour-info { flex: 1; min-width: 0; }
.tour-info strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tour-info small { color: var(--muted); }
.tour-actions { display: flex; gap: 0.25rem; }
.tour-actions button { background: var(--bg2); border: 1px solid #33254f; color: var(--ink); border-radius: 8px; padding: 0.3rem 0.5rem; cursor: pointer; font-size: 0.85rem; }
.tour-stats { color: var(--muted); margin-bottom: 1rem; }
.share-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.share-row input { flex: 1; background: var(--bg2); color: var(--ink); border: 1px solid #33254f; border-radius: 10px; padding: 0.5rem; font-size: 0.85rem; }
</style>
{% endblock %}
{% block content %}
<h2>&#x1F383; My Haunt Tour</h2>
<div id="tour-map"></div>
<div class="tour-controls">
  <div class="mode-toggle">
    <button id="mode-walk" class="active">&#x1F6B6; Walk</button>
    <button id="mode-drive">&#x1F697; Drive</button>
  </div>
  <button class="btn" id="btn-locate">&#x1F4CD; Show my location</button>
  <button class="btn" id="btn-clear">Clear tour</button>
</div>
<p class="tour-stats" id="tour-stats"></p>
<div class="tour-controls" id="gps-row" style="display:none">
  <button class="btn" id="btn-gmaps">&#x1F5FA;&#xFE0F; Open in Google Maps</button>
  <button class="btn" id="btn-amaps">&#x1F34E; Open in Apple Maps</button>
  <button class="btn" id="btn-copy-addr">&#x1F4CB; Copy addresses</button>
</div>
<ul class="tour-list" id="tour-list"></ul>
<div class="share-row" id="share-row" style="display:none">
  <input type="text" id="share-link" readonly>
  <button class="btn" id="btn-copy">Copy</button>
</div>
<button class="btn" id="btn-share" style="display:none">Share this tour</button>
<div class="empty" id="tour-empty" style="display:none">
  <p class="empty-emoji">&#x1F5FA;&#xFE0F;</p>
  <p>Your tour is empty. Tap "+ Tour" on any haunt to add it.</p>
  <p><a class="btn" href="/">Browse haunts</a></p>
</div>

<script>
const sharedEntries = {{ shared | tojson }};
let tour = [];  // [{id, title, town, lat, lng}]
let mode = 'walk';
let map, routeLayer, userMarker;

function loadTour() {
  if (sharedEntries.length) {
    tour = sharedEntries.map(e => ({id: e.id, title: e.title, town: e.town, lat: e.lat, lng: e.lng, thumb: e.thumb_url}));
  } else {
    try { tour = JSON.parse(localStorage.getItem('haunt_tour') || '[]'); } catch(e) { tour = []; }
  }
  // drop entries without coords
  tour = tour.filter(e => e.lat && e.lng);
}
function saveTour() {
  if (!sharedEntries.length) localStorage.setItem('haunt_tour', JSON.stringify(tour));
}
function initMap() {
  map = L.map('tour-map').setView([40.75, -74.0], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19}).addTo(map);
  routeLayer = L.layerGroup().addTo(map);
}
async function drawRoute() {
  routeLayer.clearLayers();
  if (tour.length < 2) { updateStats(0); return; }
  const profile = mode === 'walk' ? 'foot' : 'driving';
  const coords = tour.map(e => `${e.lng},${e.lat}`).join(';');
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${coords}?overview=full&geometries=geojson`);
    const j = await r.json();
    if (j.routes && j.routes[0]) {
      L.geoJSON(j.routes[0].geometry, {style: {color: '#ff7a1a', weight: 4}}).addTo(routeLayer);
      updateStats(j.routes[0].distance / 1609.34);
    }
  } catch(e) { updateStats(0); }
}
function updateStats(miles) {
  document.getElementById('tour-stats').textContent =
    tour.length ? `${tour.length} stop${tour.length != 1 ? 's' : ''}` + (miles ? ` · ~${miles.toFixed(1)} mi ${mode === 'walk' ? 'walking' : 'driving'}` : '') : '';
  document.getElementById('gps-row').style.display = tour.length > 1 ? 'flex' : 'none';
}
function openGMaps() {
  if (tour.length < 2) return;
  const travelmode = mode === 'walk' ? 'walking' : 'driving';
  const origin = `${tour[0].lat},${tour[0].lng}`;
  const dest = `${tour[tour.length-1].lat},${tour[tour.length-1].lng}`;
  const waypoints = tour.slice(1, -1).map(e => `${e.lat},${e.lng}`).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=${travelmode}`;
  if (waypoints) url += `&waypoints=${waypoints}`;
  window.open(url, '_blank');
}
function openAMaps() {
  if (tour.length < 2) return;
  const dirflg = mode === 'walk' ? 'w' : 'd';
  const dest = `${tour[tour.length-1].lat},${tour[tour.length-1].lng}`;
  window.open(`https://maps.apple.com/?daddr=${dest}&dirflg=${dirflg}`, '_blank');
}
document.getElementById('btn-gmaps').onclick = openGMaps;
document.getElementById('btn-amaps').onclick = openAMaps;
document.getElementById('btn-copy-addr').onclick = async () => {
  const text = tour.map((e, i) => `${i+1}. ${e.title} — ${e.town}`).join('\n');
  try { await navigator.clipboard.writeText(text); alert('Addresses copied!'); }
  catch(e) { prompt('Copy these addresses:', text); }
};
function render() {
  const list = document.getElementById('tour-list');
  list.innerHTML = '';
  document.getElementById('tour-empty').style.display = tour.length ? 'none' : 'block';
  document.getElementById('btn-share').style.display = tour.length > 1 ? 'block' : 'none';
  const bounds = [];
  tour.forEach((e, i) => {
    bounds.push([e.lat, e.lng]);
    L.marker([e.lat, e.lng]).addTo(routeLayer)
      .bindPopup(`<b>${i+1}. ${e.title}</b><br>${e.town}`);
    const li = document.createElement('li');
    li.innerHTML = `<span class="tour-num">${i+1}</span>
      ${e.thumb ? `<img class="tour-thumb" src="${e.thumb}" alt="">` : ''}
      <span class="tour-info"><strong>${e.title}</strong><small>${e.town}</small></span>
      <span class="tour-actions">
        ${i > 0 ? `<button data-act="up" data-i="${i}" title="Move up">&#x25B2;</button>` : ''}
        ${i < tour.length-1 ? `<button data-act="down" data-i="${i}" title="Move down">&#x25BC;</button>` : ''}
        <button data-act="rm" data-i="${i}" title="Remove">&#x2715;</button>
      </span>`;
    list.appendChild(li);
  });
  if (bounds.length) map.fitBounds(bounds, {padding: [30, 30]});
  drawRoute();
  saveTour();
}
document.getElementById('tour-list').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const i = +b.dataset.i, act = b.dataset.act;
  if (act === 'rm') tour.splice(i, 1);
  else if (act === 'up' && i > 0) [tour[i-1], tour[i]] = [tour[i], tour[i-1]];
  else if (act === 'down' && i < tour.length-1) [tour[i+1], tour[i]] = [tour[i], tour[i+1]];
  render();
});
document.getElementById('mode-walk').onclick = () => { mode = 'walk'; setMode(); };
document.getElementById('mode-drive').onclick = () => { mode = 'drive'; setMode(); };
function setMode() {
  document.getElementById('mode-walk').classList.toggle('active', mode === 'walk');
  document.getElementById('mode-drive').classList.toggle('active', mode === 'drive');
  render();
}
document.getElementById('btn-clear').onclick = () => { tour = []; render(); };
document.getElementById('btn-share').onclick = () => {
  const ids = tour.map(e => e.id).join(',');
  const link = `${location.origin}/tour?s=${ids}`;
  document.getElementById('share-link').value = link;
  document.getElementById('share-row').style.display = 'flex';
};
document.getElementById('btn-copy').onclick = async () => {
  const inp = document.getElementById('share-link');
  inp.select();
  try { await navigator.clipboard.writeText(inp.value); } catch(e) { document.execCommand('copy'); }
};
document.getElementById('btn-locate').onclick = () => {
  if (!navigator.geolocation) return alert('Geolocation not supported');
  navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (userMarker) userMarker.setLatLng(ll);
    else userMarker = L.marker(ll, {title: 'You'}).addTo(map).bindPopup('You are here').openPopup();
    map.setView(ll, 14);
  }, err => alert('Could not get your location'), {enableHighAccuracy: true});
};
loadTour(); initMap(); render();
</script>
{% endblock %}

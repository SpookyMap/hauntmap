<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MerryQuest — The Quest Begins December 1</title>
<meta name="description" content="MerryQuest: Christmas Lights. Capture the Magic. The quest begins December 1, 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800;900&family=Luckiest+Guy&family=Nosifer&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Luckiest Guy";
    src: url("/static/fonts/luckiest-guy-latin.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif; color: #ffffff;
    background: #0a1420; min-height: 100vh; overflow-x: hidden;
  }
  .bg { position: fixed; inset: 0; z-index: 0; }
  .bg video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(43, 16, 84, 0.34) 0%, rgba(43, 16, 84, 0.10) 42%, rgba(10, 4, 26, 0.72) 100%),
      linear-gradient(180deg, rgba(5, 10, 18, 0.30) 0%, rgba(5, 10, 18, 0.12) 42%, rgba(5, 10, 18, 0.55) 100%);
  }
  .wrap {
    position: relative; z-index: 1; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 20px 40px;
  }
  .logo { margin: 0 0 14px; line-height: 0; }
  .logo img {
    width: min(640px, 92vw); height: auto;
    filter: drop-shadow(0 6px 22px rgba(6, 10, 30, 0.45)) drop-shadow(0 0 26px rgba(120, 220, 255, 0.22));
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .tag { margin: 0 0 34px; font-size: clamp(14px, 2.4vw, 18px); color: #ffe9b0; font-weight: 600; letter-spacing: 0.04em; }
  .begins {
    margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.34em; text-indent: 0.34em;
    text-transform: uppercase; color: #ffd98a;
  }
  .cd { display: flex; justify-content: center; gap: clamp(10px, 4.5vw, 54px); margin: 10px 0 36px; width: 100%; }
  .cell { text-align: center; min-width: 0; }
  .cell span {
    display: block; font-family: "Luckiest Guy", cursive; font-weight: 400;
    font-size: clamp(50px, 14vw, 168px); line-height: 0.95; color: #c8f6ff;
    transform: skewX(-3deg);
    text-shadow: 0 0 16px rgba(110, 230, 255, 0.75), 0 0 52px rgba(110, 230, 255, 0.40), 0 6px 0 rgba(20, 10, 50, 0.55);
  }
  .colon {
    font-family: "Luckiest Guy", cursive; font-size: clamp(40px, 11vw, 130px); line-height: 0.95;
    color: #8fe9ff; align-self: flex-start; padding-top: 0.06em;
    text-shadow: 0 0 14px rgba(110, 230, 255, 0.7);
  }
  .cell label {
    display: block; margin-top: 10px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.32em; text-indent: 0.32em; text-transform: uppercase; color: #eef4ee;
  }
  .cta {
    display: inline-block; text-decoration: none; font-weight: 800; font-size: 16px; color: #131313;
    background: linear-gradient(92deg, #ffc82c, #eb7a2c); padding: 14px 30px; border-radius: 999px;
    box-shadow: 0 8px 30px rgba(235, 122, 44, 0.4);
  }
  .note { margin: 20px 0 0; font-size: 13.5px; color: #cfdccf; }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video autoplay muted loop playsinline preload="metadata" poster="/static/img/mq-sleigh-future.jpg">
      <source src="/static/video/mq-hero-sleigh.mp4" type="video/mp4">
    </video>
  </div>
  <main class="wrap">
    <h1 class="logo"><img src="/static/img/merryquest-logo.png" alt="MerryQuest" width="620" height="124"><span class="sr-only">MerryQuest</span></h1>
    <p class="tag">MerryQuest: Christmas Lights · Capture the Magic</p>
    <p class="begins">The quest begins in</p>
    <div class="cd" role="timer" aria-label="Countdown to the December 1 launch">
      <div class="cell"><span id="cd-d">--</span><label>Days</label></div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="cell"><span id="cd-h">--</span><label>Hours</label></div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="cell"><span id="cd-m">--</span><label>Minutes</label></div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="cell"><span id="cd-s">--</span><label>Seconds</label></div>
    </div>
    <a class="cta" href="https://gomerryquest.com">Enter gomerryquest.com</a>
    <p class="note">The app arrives December 1 · iOS &amp; Android</p>
  </main>
  <button id="sound-btn" type="button" aria-label="Turn the sound on" style="position:fixed;right:16px;bottom:16px;z-index:5;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,0.35);background:rgba(8,12,20,0.55);font-size:20px;line-height:1;cursor:pointer;color:#fff;">🔇</button>
<script>
(function () {
  var cd = { d: document.getElementById('cd-d'), h: document.getElementById('cd-h'),
             m: document.getElementById('cd-m'), s: document.getElementById('cd-s') };
  var target = Date.UTC(2026, 11, 1, 5, 0, 0); /* Dec 1, 2026, midnight ET */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var ms = target - Date.now();
    if (ms <= 0) { cd.d.textContent = 'GO'; cd.h.textContent = 'LI'; cd.m.textContent = 'VE'; cd.s.textContent = '!'; return; }
    var s = Math.floor(ms / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    cd.d.textContent = d; cd.h.textContent = pad(h); cd.m.textContent = pad(m); cd.s.textContent = pad(s);
    setTimeout(tick, 1000);
  }
  tick();
  var sb = document.getElementById('sound-btn');
  var vid = document.querySelector('.bg video');
  if (sb && vid) {
    sb.addEventListener('click', function () {
      vid.muted = !vid.muted;
      if (!vid.muted) { vid.play(); }
      sb.textContent = vid.muted ? '🔇' : '🔊';
      sb.setAttribute('aria-label', vid.muted ? 'Turn the sound on' : 'Turn the sound off');
    });
  }
})();
</script>
</body>
</html>

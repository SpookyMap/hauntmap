<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="90">
<meta name="theme-color" content="#000000">
<title>HauntMap — Back Soon</title>
<style>
  /* Self-contained on purpose: this page must render even when the app's
     templates/DB are unhappy, and it doubles as the file an edge service
     (e.g. a Cloudflare Worker) can serve when the origin is unreachable.
     Only site-hosted assets are referenced (logo + Creepster font). */
  @font-face {
    font-family: "Creepster";
    src: url("/static/fonts/Creepster.ttf") format("truetype");
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #f5f5f5;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100svh;
    padding: 1.5rem; text-align: center;
  }
  .card { max-width: 560px; width: 100%; }
  .logo {
    width: 132px; height: auto;
    filter: drop-shadow(0 10px 26px rgba(0,0,0,.8));
    margin-bottom: 1.4rem;
  }
  .cones { font-size: 2rem; letter-spacing: .35rem; margin-bottom: .9rem; }
  h1 {
    font-family: "Creepster", "Impact", cursive;
    font-weight: 400;
    font-size: clamp(2.1rem, 8.5vw, 3.4rem);
    line-height: 1.08;
    color: #ff7b1c;
    letter-spacing: .04em;
    text-shadow: 0 3px 0 #7a2d00, 0 8px 26px rgba(0,0,0,.6);
    margin-bottom: 1.1rem;
  }
  p.body { font-size: 1.13rem; line-height: 1.55; color: #f5f5f5; margin-bottom: .85rem; }
  p.small { font-size: .95rem; color: #a3a3a3; margin-bottom: 1.7rem; }
  a.retry {
    display: inline-block;
    background: #ff7b1c; color: #1a0f00;
    font-weight: 800; text-decoration: none;
    padding: .8rem 1.9rem; border-radius: 999px;
    box-shadow: 0 6px 20px rgba(255,123,28,.35);
  }
  a.retry:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/static/img/hauntmap_logo_lockup.webp" alt="HauntMap">
    <div class="cones" aria-hidden="true">🎃 🚧 🎃</div>
    <h1>Down for a Quick Spell of Construction</h1>
    <p class="body">HauntMap is briefly down while we build something better. We&rsquo;ll be back soon!!</p>
    <p class="small">The haunts aren&rsquo;t going anywhere — check back in a few minutes.</p>
    <a class="retry" href="/">Try Again</a>
  </main>
</body>
</html>
